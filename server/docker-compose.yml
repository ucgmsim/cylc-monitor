# The Cylc monitor: Datasette on 127.0.0.1:8017 (put a reverse proxy with TLS in front,
# e.g. Caddyfile.example), its database in ./data/cylc.db. See ../README.md.
#
#   cp env.example .env && chmod 600 .env && $EDITOR .env   # once: the secret and password hash
#   sudo docker compose up -d --build
services:
  datasette:
    build: .
    # force_https_urls: the server sits behind a TLS reverse proxy that talks plain http to
    # it. Without it Datasette's absolute URLs, and so datasette-dashboards' chart data
    # URLs, are http, and the browser blocks them as mixed content: every chart is empty.
    command: >
      datasette serve /data/cylc.db --create --config /app/datasette.yaml --plugins-dir /app/plugins
      --host 0.0.0.0 --port 8001
      --setting sql_time_limit_ms 3000 --setting max_returned_rows 5000
      --setting force_https_urls 1
    environment:
      DATASETTE_SECRET: ${DATASETTE_SECRET:?set DATASETTE_SECRET in .env}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?set ADMIN_PASSWORD_HASH in .env}
    ports:
      - "127.0.0.1:8017:8001"
    volumes:
      - ./data:/data
    restart: unless-stopped

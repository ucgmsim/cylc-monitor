# The monitor's Datasette: nothing for anonymous visitors. Three actors:
#   admin        a person in the browser, logged in at /-/login (datasette-auth-passwords)
#   cylc-writer  cylc_monitor_upload.py on the scheduler host: a token whose only use is
#                POST /-/cylc/upload (plugins/cylc_upload.py checks the actor's id)
#   cylc-reader  whoever follows the runs off the cluster (a person's script, an agent):
#                a token that may only read and run read-only SQL (make_token.py reader)
title: Cylc monitor
description: Cylc workflows' own databases, uploaded from the scheduler host as they change.
# Spacing for the dashboard's tables (static/, served at /assets/ by --static).
extra_css_urls: [/assets/dashboard.css]
allow:
  id: [admin, cylc-reader, cylc-writer]
plugins:
  datasette-auth-passwords:
    admin_password_hash:
      $env: ADMIN_PASSWORD_HASH
  # /-/dashboards/cylc. Active workflows: those not stopped (running, paused, stalled or silent),
  # read off monitor.status rather than the workflows view, which would compute jobs twice.
  datasette-dashboards:
    cylc:
      title: Cylc workflows
      description: Jobs submitted, running and finished, what they asked for and what they used. Core-hours and RSUs count from each job's start to its end, or to its workflow's last upload.
      filters:
        workflow:
          name: Workflow
          type: select
          db: cylc
          query: SELECT workflow FROM monitor ORDER BY uploaded_at DESC
      layout:
        - [running, queued, failed, core-hours, rsu]
        - [throughput, throughput, throughput, cumulative, cumulative]
        - [workflows, workflows, workflows, workflows, workflows]
        - [active, active, active, active, active]
        - [finished, finished, finished, finished, finished]
        - [by-task, by-task, by-task, by-task, by-task]
      charts:
        running:
          title: Jobs running
          db: cylc
          library: metric
          display: {field: n}
          query: >
            SELECT count(*) AS n FROM jobs
            WHERE state = 'running' AND workflow IN (SELECT workflow FROM monitor WHERE status != 'stopped') [[ AND workflow = :workflow ]]
        queued:
          title: Jobs queued
          db: cylc
          library: metric
          display: {field: n}
          query: >
            SELECT count(*) AS n FROM jobs
            WHERE state IN ('submitting', 'submitted') AND workflow IN (SELECT workflow FROM monitor WHERE status != 'stopped') [[ AND workflow = :workflow ]]
        failed:
          title: Failed jobs (retries included)
          db: cylc
          library: metric
          display: {field: n}
          query: >
            SELECT count(*) AS n FROM jobs
            WHERE state IN ('failed', 'submit-failed') AND workflow IN (SELECT workflow FROM monitor WHERE status != 'stopped') [[ AND workflow = :workflow ]]
        core-hours:
          title: Core-hours, active workflows
          db: cylc
          library: metric
          display: {field: n}
          query: >
            SELECT round(coalesce(sum(core_hours), 0), 1) AS n FROM workflows
            WHERE health != 'stopped' [[ AND workflow = :workflow ]]
        rsu:
          title: RSUs, active workflows
          db: cylc
          library: metric
          display: {field: n}
          query: >
            SELECT round(coalesce(sum(rsu), 0), 1) AS n FROM workflows
            WHERE health != 'stopped' [[ AND workflow = :workflow ]]
        throughput:
          title: Jobs over time (finished by exit, running by start, queued by submit)
          db: cylc
          library: vega-lite
          display:
            # Bars span the step the query picked for the time shown; drag to pan, scroll to zoom.
            params:
              - name: zoom
                select: {type: interval, encodings: [x]}
                bind: scales
            # Vega-Lite won't stack bars that have an x2, so stack them here: queued on top.
            transform:
              - stack: n
                groupby: [start]
                sort: [{field: rank}]
                as: [y0, y1]
            mark: {type: bar, tooltip: true}
            encoding:
              x: {field: start, type: temporal, title: Time}
              x2: {field: end}
              y: {field: y0, type: quantitative, title: Jobs a bar}
              y2: {field: y1}
              color:
                field: state
                type: nominal
                title: State
                sort: [queued, running, succeeded, failed, submit-failed]
                scale:
                  domain: [queued, running, succeeded, failed, submit-failed]
                  range: ['#9aa5b1', '#4f86c6', '#4c9a5f', '#d1495b', '#edae49']
              tooltip:
                - {field: start, type: temporal, title: From, format: '%Y-%m-%d %H:%M'}
                - {field: bar, type: nominal, title: Bar}
                - {field: state, type: nominal, title: State}
                - {field: n, type: quantitative, title: Jobs}
          # Each job once, at its latest event. The step: the smallest of 1h, 3h, 6h, 12h, 1d and
          # 1w giving at most 60 bars over the jobs shown (buckets are aligned to UTC).
          query: >
            WITH j AS (
              SELECT CAST(strftime('%s', coalesce(time_run_exit, time_run, time_submit)) AS INTEGER) AS t,
                     CASE WHEN state IN ('submitting', 'submitted') THEN 'queued' ELSE state END AS state,
                     CASE state WHEN 'succeeded' THEN 1 WHEN 'failed' THEN 2 WHEN 'submit-failed' THEN 3
                                WHEN 'running' THEN 4 ELSE 5 END AS rank
              FROM jobs
              WHERE coalesce(time_run_exit, time_run, time_submit) IS NOT NULL
                AND (state IN ('succeeded', 'failed', 'submit-failed')
                     OR workflow IN (SELECT workflow FROM monitor WHERE status != 'stopped'))
                [[ AND workflow = :workflow ]]
            ), step AS (
              SELECT coalesce(min(column1), 604800) AS s
              FROM (VALUES (3600), (10800), (21600), (43200), (86400), (604800))
              WHERE (SELECT max(t) - min(t) FROM j) / column1 < 60
            )
            SELECT strftime('%Y-%m-%dT%H:%M:%SZ', t / s * s, 'unixepoch') AS start,
                   strftime('%Y-%m-%dT%H:%M:%SZ', t / s * s + s, 'unixepoch') AS "end",
                   CASE s WHEN 3600 THEN '1 hour' WHEN 86400 THEN '1 day' WHEN 604800 THEN '1 week'
                          ELSE (s / 3600) || ' hours' END AS bar,
                   state, rank, count(*) AS n
            FROM j, step
            GROUP BY t / s, state, rank
        cumulative:
          title: Core-hours used, finished jobs
          db: cylc
          library: vega-lite
          display:
            mark: {type: line, interpolate: step-after, point: false, tooltip: true}
            encoding:
              x: {field: time_run_exit, type: temporal, title: Time}
              y: {field: core_hours, type: quantitative, title: Core-hours (cumulative)}
              color: {field: workflow, type: nominal, title: Workflow}
          query: >
            SELECT workflow, strftime('%Y-%m-%dT%H:%M:%SZ', time_run_exit) AS time_run_exit,
                   round(sum(core_hours) OVER (PARTITION BY workflow ORDER BY julianday(time_run_exit)
                                               ROWS UNBOUNDED PRECEDING), 1) AS core_hours
            FROM jobs WHERE time_run_exit IS NOT NULL AND core_hours > 0 [[ AND workflow = :workflow ]]
            ORDER BY workflow, time_run_exit
        workflows:
          title: Workflows
          db: cylc
          library: table
          query: SELECT * FROM workflows WHERE 1 [[ AND workflow = :workflow ]] ORDER BY uploaded_at DESC
        active:
          title: Submitted and running jobs, active workflows
          db: cylc
          library: table
          query: >
            SELECT j.workflow, j.cycle, j.name, j.try_num, j.job_id, j.state, j.time_submit, j.time_run,
                   j.queue_s, j.run_s, j.cores, j.mem_gb, j.time_limit_min, j.core_hours, j.rsu
            FROM jobs j
            WHERE j.state IN ('submitting', 'submitted', 'running')
              AND j.workflow IN (SELECT workflow FROM monitor WHERE status != 'stopped')
              [[ AND j.workflow = :workflow ]]
            ORDER BY j.state DESC, j.time_submit
        by-task:
          title: Core-hours by task
          db: cylc
          library: vega-lite
          display:
            mark: {type: bar, tooltip: true}
            encoding:
              x: {field: name, type: nominal, title: Task, sort: '-y'}
              y: {field: core_hours, type: quantitative, title: Core-hours}
              color: {field: workflow, type: nominal, title: Workflow}
          query: >
            SELECT workflow, name, round(sum(core_hours), 1) AS core_hours FROM jobs
            WHERE core_hours > 0 [[ AND workflow = :workflow ]] GROUP BY workflow, name
        finished:
          title: Finished jobs, latest 200 (asked for vs used)
          db: cylc
          library: table
          query: >
            SELECT workflow, cycle, name, try_num, state, time_run_exit, run_s, cores, core_hours, rsu,
                   mem_gb, max_rss_gb, cpu_hours, cpu_efficiency
            FROM jobs WHERE state IN ('succeeded', 'failed', 'submit-failed') [[ AND workflow = :workflow ]]
            ORDER BY time_run_exit DESC LIMIT 200
